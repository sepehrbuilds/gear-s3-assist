<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Gear Assist</title><link rel="stylesheet" href="style.css"></head>
<body><main id="face" class="offline"><div id="ring"></div><header>GEAR <b>ASSIST</b></header><button id="exit" aria-label="Close">×</button><button id="info" aria-label="Connection status">i</button><div id="state">CONNECTING</div><button id="talk" aria-label="Start or stop recording"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="24" y="7" width="16" height="32" rx="8"/><path d="M16 29v5a16 16 0 0032 0v-5M32 50v8M23 58h18"/></svg><span id="meter">● ● ● ● ●</span></button><section id="result" aria-live="polite"><div id="answer"></div><div id="actions"></div></section><p id="hint">Connecting to watch service</p><button id="again">NEW REQUEST</button><footer><span id="gain">MIC +18 dB</span><small>BACK · TALK &nbsp; BEZEL · GAIN</small></footer><section id="panel"><h2>CONNECTION</h2><div class="status-row">Watch service <b id="watch-status">Connecting</b></div><div class="status-row">Mac backend <b id="backend-status">Not checked</b></div><div class="status-row">Home Assistant <b id="ha-status">Not checked</b></div><div class="status-row">Cloud model <b id="cloud-status">Not checked</b></div><p id="model-name"></p><button id="refresh">CHECK CONNECTION</button><button id="close-panel">BACK</button></section></main><script src="control-key.js"></script><script src="app.js"></script></body></html>
